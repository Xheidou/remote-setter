# Régénère les données (géométrie, types de prises, blocs) puis compile et publie le site sur GitHub Pages.
# Déclenché à chaque push sur main, chaque nuit, et à la main (onglet Actions > Run workflow).
# Les données sont comparées à celles du site en ligne : si une board perd des prises, des contours ou plus
# de la moitié de ses blocs, l'exécution échoue (e-mail de GitHub) et le site garde sa version précédente.
name: Données et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"        # 4 h 17 UTC, après la génération nocturne des snapshots Boardsesh
  workflow_dispatch:
    inputs:
      limit:
        description: "Blocs gardés par board (0 = tous)"
        default: "0"
      force:
        description: "Publier même si les contrôles des données échouent"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache des snapshots et fichiers sources : seuls les snapshots qui ont changé sont retéléchargés
      - uses: actions/cache@v4
        with:
          path: .cache/board-data
          key: board-data-${{ github.run_id }}
          restore-keys: board-data-

      # Adresse du site en ligne : son manifeste sert de référence pour les contrôles
      - id: pages
        uses: actions/configure-pages@v5

      - name: Générer et contrôler les données
        run: >
          python3 scripts/build_board_data.py
          --limit "${{ github.event.inputs.limit || '0' }}"
          --check-against "${{ steps.pages.outputs.base_url }}/data/index.json"
          ${{ github.event.inputs.force == 'true' && '--no-check' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compiler le site
        run: |
          # versions figées par package-lock.json quand il est présent
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # GitHub met en pause les tâches planifiées d'un dépôt public après 60 jours sans activité :
  # chaque nuit, on réactive celle-ci par l'API (sans commit).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Garder la génération nocturne active
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
